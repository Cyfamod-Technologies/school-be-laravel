name: CI/CD Pipeline

# NOTE: when a real `staging` branch exists, add it to both trigger
# lists below (push and pull_request) as a second entry alongside
# `main`. Don't add it as a commented-out placeholder before the
# branch exists -- that's exactly how `main` ended up silently
# disconnected from this pipeline for who knows how long: a
# reference to a branch nobody kept in sync with reality.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Run Tests (CI)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: MYSTRINGPASSWORD
          MYSQL_DATABASE: school-mgt-test-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pMYSTRINGPASSWORD --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, pdo, pdo_mysql
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Tests
        run: php artisan test

  cd:
    name: Deploy to Server (CD)
    runs-on: ubuntu-latest
    needs: ci  # Only runs if CI passes
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd /home/ubuntu/school-be-php
            git checkout -- storage/api-docs/api-docs.json
            git pull
            docker restart school-be
