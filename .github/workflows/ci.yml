name: CI Pipeline

# Renamed from deploy.yml to ci.yml: this file used to also carry a `cd`
# job (SSH + `docker restart`) that deployed main to Hostinger, but that
# job never actually ran (main's trigger was broken until #110, and the
# target account can't run Docker at all - it's shared hosting). Dropped
# entirely rather than fixed, because main is deployed manually by design
# (SSH + git pull; there's a manual database fix-up step required before
# each deploy that isn't safe to script yet). staging has no deploy target
# and none is planned. So this file now only ever needs to run tests, on
# any branch - real dev deployment automation lives in the separate
# cd-dev.yml file instead.
on:
  push:
    branches:
      # - main
      - staging
      - dev
  pull_request:
    branches:
      - dev
      - staging

jobs:
  ci:
    name: Run Tests (CI)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: MYSTRINGPASSWORD
          MYSQL_DATABASE: school-mgt-test-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pMYSTRINGPASSWORD --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, pdo, pdo_mysql
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Tests
        run: php artisan test
