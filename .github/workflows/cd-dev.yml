name: Build and Deploy Application

# Deploys dev. Separate from ci.yml, which only runs tests. The actual
# deploy mechanism lives in deploy-dokploy.yml (shared with cd-staging.yml);
# this file only says which app/DB/credentials dev deploys to.
on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

  workflow_dispatch:

concurrency:
  group: web-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    uses: ./.github/workflows/deploy-dokploy.yml
    with:
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SERVER_ENV_FILE: ${{ vars.SERVER_ENV_FILE }}
      DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH }}
      BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT }}
    secrets:
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOCKER_BUILD_ARGS: ${{ secrets.DOCKER_BUILD_ARGS }}
