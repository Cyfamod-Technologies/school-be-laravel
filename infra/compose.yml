services:
  app:
    build:
      # Relative to this file's own location, not the repo root - infra/
      # moved this file down one level, so the build context needs ".."
      # to still resolve to the repo root.
      context: ..
      dockerfile: infra/Dockerfile
    # container_name: school-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Named volumes for persistent data
      - appdev-storage:/var/www/html/storage/app
      - appdev-public:/var/www/html/public/storage
    # Runtime environment is provided at deploy time, not this file - see
    # SERVER_ENV_FILE in cd-dev.yml.
volumes:
  appdev-storage:
  appdev-public:
