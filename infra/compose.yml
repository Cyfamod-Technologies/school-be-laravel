version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    # container_name: school-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Named volumes for persistent data
      - appdev-storage:/var/www/html/storage/app
      - appdev-public:/var/www/html/public/storage
    # Runtime environment is provided by Dokploy, not this file - see
    # SERVER_ENV_FILE in cd-dev.yml.
volumes:
  appdev-storage:
  appdev-public:
